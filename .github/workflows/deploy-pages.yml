name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build web
        run: npm --workspace apps/web run build
        env:
          VITE_GEOTAB_DATABASE: opex_trial
          # Public, non-secret. Set as a repository VARIABLE (not a secret) once the
          # Worker exists: https://opex-vbm-api.<account-subdomain>.workers.dev
          # When unset the UI shows "Backend not connected".
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: SPA fallback for GitHub Pages
        run: Copy-Item apps/web/dist/index.html apps/web/dist/404.html -Force
        shell: pwsh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
