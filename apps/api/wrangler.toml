name = "opex-vbm-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
ALLOWED_ORIGIN = "https://vbm.opexcg.com"
GEOTAB_DATABASE = "opex_trial"

